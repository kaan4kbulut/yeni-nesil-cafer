# Her gönderimde testler Linux'ta ve Windows'ta çalışır: Windows'a özgü hatalar arkadaşlara ulaşmadan yakalansın.
name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"  # program Windows'ta da -X utf8 ile başlatılır
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt'nin sistem kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0
      - name: "Program ve test kütüphaneleri (3D/belge; atlanan test kalmasın)"
        run: python -m pip install -r requirements-test.txt
      - name: Testler
        shell: bash
        run: |
          python -m pytest testler -q -rs --strict-markers -p no:cacheprovider 2>&1 | tee test-sonucu.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Atlanan test uyarısı (hedef 0)
        if: always()
        shell: bash
        run: |
          n=$(grep -c '^SKIPPED' test-sonucu.txt || true)
          if [ "$n" -gt 0 ]; then echo "::warning title=Atlanan testler::$n test atlandı (hedef 0):"; grep '^SKIPPED' test-sonucu.txt; else echo "atlanan test yok"; fi
