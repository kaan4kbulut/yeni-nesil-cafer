# Her gönderimde testler Linux'ta ve Windows'ta çalışır: Windows'a özgü hatalar arkadaşlara ulaşmadan yakalansın.
name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"  # program Windows'ta da -X utf8 ile başlatılır
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt'nin sistem kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0
      - name: Program kütüphaneleri
        run: python -m pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s testler -v
